; M5Stack Cardputer v1.1 (Stamp-S3: ESP32-S3FN8, 8 MB flash, no PSRAM)
;   pio run -t upload        build + flash firmware
;   pio device monitor       serial log (tokens/s, ctx shown to the model)
; The model is NOT flashed here: put model.bin on the SD card and the firmware copies it
; into the "model" partition on boot.

[env:cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
build_unflags = -Os
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DVOICE_DEFAULT_ON=0        ; testing: boot muted (/talk turns it on). Set to 1 to restore.
lib_deps =
    m5stack/M5Cardputer@^1.0.3
    earlephilhower/ESP8266Audio@1.9.7   ; only its AudioOutput base class is used
    earlephilhower/ESP8266SAM@^1.0.1    ; SAM robot voice
    z3t0/IRremote@^4.4.1                ; IR send on G44 (NEC)
